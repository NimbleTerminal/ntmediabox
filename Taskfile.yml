version: '3'

env:
  CGO_ENABLED: '0'
  GIT_PAGER: 'cat'

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  RACE: '{{if eq OS "darwin"}}-race{{end}}' # needs cgo on Linux
  FUZZTIME: '1000x'

tasks:
  default:
    desc: Build the library
    cmds:
      - task: build

  list:
    desc: List available tasks
    cmds:
      - task --list-all

  ci:
    desc: Full preflight gate (fmt-check, whitespace-check, lint, check, build, fuzz)
    cmds:
      - task: fmt-check
      - task: whitespace-check
      - task: lint
      - task: check
      - task: build
      - task: fuzz

  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Check Go formatting without changing files
    cmds:
      - |
        files="$(gofmt -l .)"
        if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi

  whitespace-check:
    desc: Check tracked files and pending changes for whitespace errors
    cmds:
      - git --no-pager diff --check "$(git hash-object -t tree /dev/null)"

  build:
    desc: Build root and pkg/mediabox
    cmds:
      - go build -mod=readonly ./...
      - go -C pkg/mediabox build -mod=readonly ./...

  test:
    desc: Run the test suite
    cmds:
      - go test {{.RACE}} -count=1 ./...
      - go -C pkg/mediabox test {{.RACE}} -count=1 ./...

  vet:
    desc: go vet
    cmds:
      - go vet ./...
      - go -C pkg/mediabox vet ./...

  wasm:
    desc: Compile the package for js/wasm
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - go build .
      - go -C pkg/mediabox build ./...

  windows:
    desc: Cross-compile for windows/amd64
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build ./...
      - go -C pkg/mediabox build ./...
      - go test -c . -o dist/ntmediabox-windows.test.exe

  linux:
    desc: Cross-compile for linux/amd64 and linux/arm64
    cmds:
      - GOOS=linux GOARCH=amd64 go build ./...
      - GOOS=linux GOARCH=arm64 go build ./...

  security-doc:
    desc: Rewrite the generated wire-bound tables in SECURITY.md from the code
    cmds:
      - go test -run '^TestSecurityDocInSync$' -count=1 . -update-security-doc

  notices:
    desc: Regenerate THIRD_PARTY_NOTICES.md from the modules the library links
    cmds:
      - go run ./internal/tools/notices > THIRD_PARTY_NOTICES.md

  notices-check:
    desc: Check generated notices without modifying tracked files
    cmds:
      - mkdir -p dist
      - go run ./internal/tools/notices > dist/THIRD_PARTY_NOTICES.md
      - cmp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

  lint:
    desc: Run golangci-lint across root and pkg/mediabox
    cmds:
      - golangci-lint run ./...
      - GOOS=linux golangci-lint run ./...
      - GOOS=windows golangci-lint run ./...
      - cd pkg/mediabox && golangci-lint run ./...

  fuzz:
    desc: Run fuzz targets briefly across root and pkg/mediabox
    cmds:
      - go test -run=^$ -fuzz=FuzzPolicyValidate -fuzztime={{.FUZZTIME}} .
      - go -C pkg/mediabox test -run=^$ -fuzz=FuzzParseStatusAndOpen -fuzztime={{.FUZZTIME}} .
      - go -C pkg/mediabox test -run=^$ -fuzz=FuzzSanitizeAndTruncateUTF8 -fuzztime={{.FUZZTIME}} .
      - go -C pkg/mediabox test -run=^$ -fuzz=FuzzServeRead -fuzztime={{.FUZZTIME}} .
      - go -C pkg/mediabox test -run=^$ -fuzz=FuzzRenderClientResp -fuzztime={{.FUZZTIME}} .
      - go -C pkg/mediabox test -run=^$ -fuzz=FuzzClientRead -fuzztime={{.FUZZTIME}} .

  test-sandbox-linux:
    desc: Run the sandbox tests on a Linux kernel in Docker
    cmds:
      - docker run --rm -v "$PWD":/work/ntmediabox -w /work/ntmediabox -e CGO_ENABLED=0 -e NTMEDIABOX_REQUIRE_SANDBOX=1 --security-opt seccomp=unconfined golang:1.26 go test . -count=1

  check-published:
    desc: vet and test against the pinned, published modules (no workspace); run before tagging
    env:
      GOWORK: 'off'
    cmds:
      - go vet ./...
      - go test {{.RACE}} -count=1 ./...

  check:
    desc: vet, test, wasm, windows, linux, notices-check
    cmds:
      - task: vet
      - task: test
      - task: wasm
      - task: windows
      - task: linux
      - task: notices-check

  clean:
    desc: Remove generated binaries and dist artifacts
    cmds:
      - rm -rf bin dist
